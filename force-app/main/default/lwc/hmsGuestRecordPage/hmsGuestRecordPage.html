<template>
    <div class="hms-page">
        <!-- Loading state -->
        <template lwc:if={isLoading}>
            <div class="loading-wrap"><div class="hms-spinner"></div></div>
        </template>

        <!-- Main content -->
        <template lwc:if={hasData}>
            <!-- HERO SECTION -->
            <section class="guest-hero">
                <!-- Breadcrumb -->
                <nav class="breadcrumb">
                    <a class="breadcrumb-link" onclick={handleBack}>Guests</a>
                    <span class="breadcrumb-sep">/</span>
                    <span class="breadcrumb-current">{fullName}</span>
                </nav>

                <div class="hero-content">
                    <div class="hero-left">
                        <div class="avatar-lg">{initials}</div>
                        <div class="hero-info">
                            <span class="hero-record-type">Guest Profile</span>
                            <div class="hero-title-row">
                                <h1 class="hero-name">{fullName}</h1>
                                <template lwc:if={isVip}>
                                    <span class="vip-badge">VIP</span>
                                </template>
                            </div>
                            <div class="hero-meta">
                                <template lwc:if={email}>
                                    <span class="hero-meta-item">
                                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                                        {email}
                                    </span>
                                </template>
                                <template lwc:if={phone}>
                                    <span class="hero-meta-item">
                                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.13.81.36 1.6.64 2.35a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.75.28 1.54.5 2.35.64A2 2 0 0122 16.92z"/></svg>
                                        {phone}
                                    </span>
                                </template>
                                <template lwc:if={nationality}>
                                    <span class="hero-meta-item">
                                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
                                        {nationality}
                                    </span>
                                </template>
                            </div>
                        </div>
                    </div>
                    <div class="hero-actions">
                        <button class="hms-btn hms-btn-primary" onclick={handleNewReservation}>
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                            New Reservation
                        </button>
                        <button class="hms-btn hms-btn-secondary" onclick={handleSendEmail}>
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                            Send Email
                        </button>
                        <button class="hms-btn hms-btn-secondary" onclick={handleEdit}>
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                            Edit
                        </button>
                    </div>
                </div>
            </section>

            <!-- STATS GRID -->
            <section class="stats-grid">
                <div class="stat-card">
                    <span class="stat-label">Total Stays</span>
                    <span class="stat-value">&mdash;</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Lifetime Spend</span>
                    <span class="stat-value stat-value--green">{formattedTotalSpent}</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Avg Satisfaction</span>
                    <span class="stat-value">&mdash;</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Loyalty Tier</span>
                    <span class="stat-value">&mdash;</span>
                </div>
            </section>

            <!-- TWO-COLUMN BODY -->
            <div class="body-layout">
                <!-- MAIN COLUMN -->
                <div class="body-main">
                    <!-- Inner Tabs -->
                    <div class="tabs-row">
                        <button class={profileTabClass} data-tab="profile" onclick={handleTabClick}>Profile</button>
                        <button class={historyTabClass} data-tab="history" onclick={handleTabClick}>Stay History</button>
                        <button class={preferencesTabClass} data-tab="preferences" onclick={handleTabClick}>Preferences</button>
                        <button class={loyaltyTabClass} data-tab="loyalty" onclick={handleTabClick}>Loyalty</button>
                        <button class={casesTabClass} data-tab="cases" onclick={handleTabClick}>Cases</button>
                    </div>

                    <!-- PROFILE TAB -->
                    <template lwc:if={isProfileTab}>
                        <div class="tab-content">
                            <!-- Personal Information -->
                            <div class="section-card">
                                <h3 class="section-title">Personal Information</h3>
                                <div class="info-grid-3">
                                    <div class="info-item">
                                        <span class="info-label">First Name</span>
                                        <span class="info-value">{firstName}</span>
                                    </div>
                                    <div class="info-item">
                                        <span class="info-label">Last Name</span>
                                        <span class="info-value">{lastName}</span>
                                    </div>
                                    <div class="info-item">
                                        <span class="info-label">Title</span>
                                        <span class="info-value info-value--muted">&mdash;</span>
                                    </div>
                                    <div class="info-item">
                                        <span class="info-label">Nationality</span>
                                        <span class="info-value">{nationality}</span>
                                    </div>
                                    <div class="info-item">
                                        <span class="info-label">VIP Status</span>
                                        <template lwc:if={isVip}>
                                            <span class="info-value info-value--gold">{vipLabel}</span>
                                        </template>
                                        <template lwc:else>
                                            <span class="info-value">{vipLabel}</span>
                                        </template>
                                    </div>
                                </div>
                            </div>

                            <!-- Contact Details -->
                            <div class="section-card">
                                <h3 class="section-title">Contact Details</h3>
                                <div class="info-grid-2">
                                    <div class="info-item">
                                        <span class="info-label">Email</span>
                                        <span class="info-value info-value--accent">{email}</span>
                                    </div>
                                    <div class="info-item">
                                        <span class="info-label">Phone</span>
                                        <span class="info-value">{phone}</span>
                                    </div>
                                    <div class="info-item">
                                        <span class="info-label">Address</span>
                                        <span class="info-value">{mailingAddress}</span>
                                    </div>
                                    <div class="info-item">
                                        <span class="info-label">Country</span>
                                        <span class="info-value">{mailingCountry}</span>
                                    </div>
                                </div>
                            </div>

                            <!-- Preferences -->
                            <div class="section-card">
                                <h3 class="section-title">Preferences</h3>
                                <div class="chips-row">
                                    <template for:each={preferenceChips} for:item="chip">
                                        <span class="pref-chip" key={chip.key}>{chip.label}</span>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- STAY HISTORY TAB -->
                    <template lwc:if={isHistoryTab}>
                        <div class="tab-content">
                            <div class="section-card">
                                <h3 class="section-title">Recent Stays</h3>
                                <div class="empty-section">
                                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="empty-icon">
                                        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
                                        <polyline points="9 22 9 12 15 12 15 22"/>
                                    </svg>
                                    <p>No stay history available.</p>
                                    <span class="empty-hint">Reservations will appear here once completed.</span>
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- PREFERENCES TAB -->
                    <template lwc:if={isPreferencesTab}>
                        <div class="tab-content">
                            <div class="section-card">
                                <h3 class="section-title">Room &amp; Stay Preferences</h3>
                                <div class="chips-row">
                                    <template for:each={preferenceChips} for:item="chip">
                                        <span class="pref-chip" key={chip.key}>{chip.label}</span>
                                    </template>
                                </div>
                                <div class="info-grid-2 pref-fields">
                                    <div class="info-item">
                                        <span class="info-label">Preferred Room Type</span>
                                        <span class="info-value info-value--muted">&mdash;</span>
                                    </div>
                                    <div class="info-item">
                                        <span class="info-label">Preferred Floor</span>
                                        <span class="info-value info-value--muted">&mdash;</span>
                                    </div>
                                    <div class="info-item">
                                        <span class="info-label">Pillow Type</span>
                                        <span class="info-value info-value--muted">&mdash;</span>
                                    </div>
                                    <div class="info-item">
                                        <span class="info-label">Dietary Requirements</span>
                                        <span class="info-value info-value--muted">&mdash;</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- LOYALTY TAB -->
                    <template lwc:if={isLoyaltyTab}>
                        <div class="tab-content">
                            <div class="section-card">
                                <h3 class="section-title">Loyalty &amp; Spend Overview</h3>
                                <div class="info-grid-2">
                                    <div class="info-item">
                                        <span class="info-label">Lifetime Spend</span>
                                        <span class="info-value info-value--green">{formattedTotalSpent}</span>
                                    </div>
                                    <div class="info-item">
                                        <span class="info-label">Points Balance</span>
                                        <span class="info-value info-value--muted">&mdash;</span>
                                    </div>
                                    <div class="info-item">
                                        <span class="info-label">Current Tier</span>
                                        <span class="info-value info-value--muted">&mdash;</span>
                                    </div>
                                    <div class="info-item">
                                        <span class="info-label">Points Expiring</span>
                                        <span class="info-value info-value--muted">&mdash;</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- CASES TAB -->
                    <template lwc:if={isCasesTab}>
                        <div class="tab-content">
                            <div class="section-card">
                                <h3 class="section-title">Guest Cases</h3>
                                <div class="empty-section">
                                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="empty-icon">
                                        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                                        <polyline points="14 2 14 8 20 8"/>
                                        <line x1="16" y1="13" x2="8" y2="13"/>
                                        <line x1="16" y1="17" x2="8" y2="17"/>
                                        <polyline points="10 9 9 9 8 9"/>
                                    </svg>
                                    <p>No open cases for this guest.</p>
                                    <span class="empty-hint">Cases related to this guest will appear here.</span>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- RAIL COLUMN -->
                <aside class="body-rail">
                    <!-- Key Metrics Card -->
                    <div class="rail-card">
                        <h3 class="rail-card-title">Key Metrics</h3>
                        <div class="metrics-list">
                            <template for:each={keyMetrics} for:item="metric">
                                <div class="metric-row" key={metric.key}>
                                    <span class="metric-label">{metric.label}</span>
                                    <span class="metric-value">{metric.value}</span>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- Add Note Card -->
                    <div class="rail-card">
                        <h3 class="rail-card-title">Add Note</h3>
                        <textarea
                            class="hms-input note-input"
                            placeholder="Write a note about this guest..."
                            value={noteText}
                            onchange={handleNoteInput}></textarea>
                        <button class="hms-btn hms-btn-primary note-btn" onclick={handleAddNote}>Save Note</button>
                    </div>
                </aside>
            </div>
        </template>
    </div>
</template>
