<template>
    <div class="hms-page">
        <div class="page-header">
            <div>
                <h1 class="page-title">Housekeeping</h1>
                <span class="page-subtitle">{dirtyCount} dirty, {progressCount} in progress, {cleanCount} clean</span>
            </div>
        </div>

        <div class="hk-layout">
            <!-- Staff sidebar -->
            <div class="staff-panel">
                <div class="panel-title">Staff on Duty</div>
                <template lwc:if={hasStaff}>
                    <template for:each={staff} for:item="s">
                        <div class="staff-card" key={s.userId}>
                            <div class="staff-avatar" style={s.avatarStyle}>{s.initials}</div>
                            <div class="staff-info">
                                <div class="staff-name">{s.name}</div>
                                <div class="staff-progress">
                                    <div class="progress-bar">
                                        <div class="progress-fill" style={s.progressStyle}></div>
                                    </div>
                                    <span class="staff-count">{s.completedTasks}/{s.totalTasks}</span>
                                </div>
                            </div>
                        </div>
                    </template>
                </template>
                <template lwc:else>
                    <div class="empty-staff">No staff on duty</div>
                </template>
            </div>

            <!-- Rooms grid -->
            <div class="rooms-section">
                <div class="hk-toolbar">
                    <select class="hms-input filter-select" onchange={handleStatusFilter}>
                        <template for:each={statusOptions} for:item="opt">
                            <option key={opt.value} value={opt.value}>{opt.label}</option>
                        </template>
                    </select>
                </div>

                <template lwc:if={isLoading}>
                    <div class="loading-wrap"><div class="hms-spinner"></div></div>
                </template>
                <template lwc:elseif={hasRooms}>
                    <div class="hk-rooms-grid">
                        <template for:each={rooms} for:item="room">
                            <div class="hk-room-card hms-card" key={room.id}>
                                <div class="hk-room-header">
                                    <span class="hk-room-num">{room.roomNumber}</span>
                                    <c-hms-badge label={room.hkStatus} variant={room.hkStatus}></c-hms-badge>
                                </div>
                                <div class="hk-room-body">
                                    <div class="hk-room-meta">
                                        <span>{room.category}</span>
                                        <span>Floor {room.floor}</span>
                                    </div>
                                    <div class="hk-room-assignee">{room.assigneeName}</div>
                                </div>
                                <div class="hk-room-actions">
                                    <template lwc:if={room.isDirty}>
                                        <button class="hms-btn hms-btn-primary btn-sm" data-id={room.id} onclick={handleStartCleaningBtn}>Start</button>
                                    </template>
                                    <template lwc:if={room.isInProgress}>
                                        <button class="hms-btn hms-btn-primary btn-sm" data-id={room.id} onclick={handleMarkCleanBtn}>Done</button>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>
                <template lwc:else>
                    <div class="empty-rooms">No rooms match filters</div>
                </template>
            </div>
        </div>
    </div>
</template>
