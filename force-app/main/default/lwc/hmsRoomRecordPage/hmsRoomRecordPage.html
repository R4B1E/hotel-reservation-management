<template>
    <div class="hms-page">

        <!-- Loading spinner -->
        <template lwc:if={isLoading}>
            <div class="loading-wrap"><div class="hms-spinner"></div></div>
        </template>

        <template lwc:if={record}>

            <!-- ═══════ HIGHLIGHT BANNER ═══════ -->
            <div class="highlight-banner">
                <div class="hb-breadcrumb">
                    <span class="hb-breadcrumb-link">Rooms</span>
                    <span class="hb-breadcrumb-sep">&rsaquo;</span>
                    <span class="hb-breadcrumb-current">Room {roomNumber} &middot; {category}</span>
                </div>

                <div class="hb-top">
                    <!-- Room number icon -->
                    <div class="hb-room-icon">
                        <div class="hb-room-icon-num">{roomNumber}</div>
                        <div class="hb-room-icon-label">Room</div>
                    </div>

                    <!-- Title block -->
                    <div class="hb-title-block">
                        <div class="hb-record-type">{recordTypeLabel}</div>
                        <div class="hb-title">{pageTitle}</div>
                        <div class="hb-badges-row">
                            <span class={hkBadgeClass}>&bull; {hkStatus}</span>
                            <span class={roomStatusBadgeClass}>&bull; {roomStatus}</span>
                            <span class="hb-subtitle-text">{subtitleInfo}</span>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="hb-actions">
                        <button class="btn btn--primary">
                            <svg class="btn-icon" viewBox="0 0 20 20" fill="currentColor"><path d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z"/></svg>
                            New Booking
                        </button>
                        <button class="btn btn--secondary">
                            <svg class="btn-icon" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/></svg>
                            Maintenance
                        </button>
                        <button class="btn btn--secondary">
                            <svg class="btn-icon" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/></svg>
                            Status
                        </button>
                        <button class="btn btn--icon" title="More actions">&ctdot;</button>
                    </div>
                </div>

                <!-- Highlights strip -->
                <div class="highlights-strip">
                    <template for:each={highlightItems} for:item="hl">
                        <div class="hl-item" key={hl.key}>
                            <div class="hl-label">{hl.label}</div>
                            <div class={hl.cls}>{hl.value}</div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- ═══════ BODY: main + rail ═══════ -->
            <div class="record-body">

                <!-- ── MAIN COLUMN ── -->
                <div class="record-main">

                    <!-- Inner tabs bar -->
                    <div class="inner-tabs-bar">
                        <template for:each={tabs} for:item="tab">
                            <button
                                key={tab.name}
                                class={tab.className}
                                data-tab={tab.name}
                                onclick={handleTabClick}
                            >{tab.label}</button>
                        </template>
                    </div>

                    <!-- ── OVERVIEW TAB ── -->
                    <template lwc:if={isOverviewTab}>

                        <!-- Room Visual -->
                        <div class="section">
                            <div class="section-title">Room Visual</div>
                            <div class="room-visual-big">
                                <div class="rvb-inner">
                                    <div class="rvb-num">{roomNumber}</div>
                                    <div class="rvb-type">{category} &middot; {floorDisplay} Floor</div>
                                    <div class="rvb-badges">
                                        <span class={hkBadgeClass}>&bull; {hkStatus}</span>
                                        <span class={roomStatusBadgeClass}>&bull; {roomStatus}</span>
                                        <span class="rvb-view-chip">{viewType}</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Room Specifications -->
                        <div class="section">
                            <div class="section-title">Room Specifications</div>
                            <div class="field-grid field-grid--three">
                                <div class="field">
                                    <div class="f-label">Room Category</div>
                                    <div class="f-val">{category}</div>
                                </div>
                                <div class="field">
                                    <div class="f-label">Bed Type</div>
                                    <div class="f-val">{bedType}</div>
                                </div>
                                <div class="field">
                                    <div class="f-label">Room Size</div>
                                    <div class="f-val">{squareMeters} m&sup2;</div>
                                </div>
                                <div class="field">
                                    <div class="f-label">Floor</div>
                                    <div class="f-val">{floorDisplay} Floor</div>
                                </div>
                                <div class="field">
                                    <div class="f-label">View</div>
                                    <div class="f-val">{viewType}</div>
                                </div>
                                <div class="field">
                                    <div class="f-label">Max Occupancy</div>
                                    <div class="f-val">{maxGuests} guests</div>
                                </div>
                                <div class="field">
                                    <div class="f-label">Room Status</div>
                                    <div class="f-val"><span class={roomStatusBadgeClass}>&bull; {roomStatus}</span></div>
                                </div>
                                <div class="field">
                                    <div class="f-label">Rate / Night</div>
                                    <div class="f-val f-val--green">{priceDisplay}</div>
                                </div>
                                <div class="field">
                                    <div class="f-label">Smoking</div>
                                    <div class="f-val f-val--muted">Non-Smoking</div>
                                </div>
                            </div>
                        </div>

                        <!-- Amenities & Features -->
                        <div class="section">
                            <div class="section-title">Amenities &amp; Features</div>
                            <div class="amenity-chips">
                                <template for:each={amenityChips} for:item="chip">
                                    <div class="chip" key={chip.key}>{chip.label}</div>
                                </template>
                            </div>
                        </div>

                        <!-- 30-Day Availability -->
                        <div class="section">
                            <div class="section-title section-title--split">
                                <span>30-Day Availability</span>
                                <span class="st-action">Full Calendar</span>
                            </div>
                            <div class="avail-legend">
                                <span class="legend-item"><span class="legend-dot legend-dot--available"></span>Available</span>
                                <span class="legend-item"><span class="legend-dot legend-dot--booked"></span>Booked</span>
                                <span class="legend-item"><span class="legend-dot legend-dot--blocked"></span>Blocked</span>
                            </div>
                            <div class="avail-grid">
                                <template for:each={availabilityDays} for:item="d">
                                    <div class={d.className} key={d.key}>{d.day}</div>
                                </template>
                            </div>
                        </div>

                        <!-- Housekeeping & Maintenance -->
                        <div class="section">
                            <div class="section-title">Housekeeping &amp; Maintenance</div>
                            <div class="field-grid">
                                <div class="field">
                                    <div class="f-label">Current Status</div>
                                    <div class="f-val"><span class={hkBadgeClass}>&bull; {hkStatus}</span></div>
                                </div>
                                <div class="field">
                                    <div class="f-label">Last Cleaned</div>
                                    <div class="f-val">{lastCleaned}</div>
                                </div>
                                <div class="field">
                                    <div class="f-label">Assigned HK</div>
                                    <div class="f-val f-val--link">{assignedHkName}</div>
                                </div>
                                <div class="field">
                                    <div class="f-label">DND Status</div>
                                    <div class="f-val f-val--muted">Not Active</div>
                                </div>
                                <div class="field">
                                    <div class="f-label">Open Maintenance</div>
                                    <div class="f-val f-val--muted">None</div>
                                </div>
                                <div class="field">
                                    <div class="f-label">Last Inspection</div>
                                    <div class="f-val f-val--muted">&mdash;</div>
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- ── AVAILABILITY TAB (placeholder) ── -->
                    <template lwc:if={isAvailabilityTab}>
                        <div class="section">
                            <div class="section-title">Availability Calendar</div>
                            <div class="empty-tab-state">
                                <div class="empty-tab-icon">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                                </div>
                                <div class="empty-tab-title">Full availability calendar coming soon</div>
                                <div class="empty-tab-desc">Detailed 90-day calendar view with drag-to-book functionality.</div>
                            </div>
                        </div>
                    </template>

                    <!-- ── MAINTENANCE TAB (placeholder) ── -->
                    <template lwc:if={isMaintenanceTab}>
                        <div class="section">
                            <div class="section-title">Maintenance Requests</div>
                            <div class="empty-tab-state">
                                <div class="empty-tab-icon">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg>
                                </div>
                                <div class="empty-tab-title">No open maintenance requests</div>
                                <div class="empty-tab-desc">Maintenance history and work orders for this room will appear here.</div>
                            </div>
                        </div>
                    </template>

                    <!-- ── REVENUE TAB (placeholder) ── -->
                    <template lwc:if={isRevenueTab}>
                        <div class="section">
                            <div class="section-title">Revenue Analytics</div>
                            <div class="empty-tab-state">
                                <div class="empty-tab-icon">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
                                </div>
                                <div class="empty-tab-title">Revenue data coming soon</div>
                                <div class="empty-tab-desc">ADR, RevPAR, and per-room revenue trends will be displayed here.</div>
                            </div>
                        </div>
                    </template>

                    <!-- ── HISTORY TAB (placeholder) ── -->
                    <template lwc:if={isHistoryTab}>
                        <div class="section">
                            <div class="section-title">Activity History</div>
                            <div class="empty-tab-state">
                                <div class="empty-tab-icon">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                                </div>
                                <div class="empty-tab-title">No history records</div>
                                <div class="empty-tab-desc">Past reservations, status changes, and activity log will appear here.</div>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- ── RAIL COLUMN ── -->
                <div class="record-rail">

                    <!-- Current Reservation -->
                    <div class="rail-section">
                        <div class="rail-title">
                            <svg class="rail-title-icon" viewBox="0 0 20 20" fill="currentColor"><path d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1z"/></svg>
                            Current Reservation
                        </div>
                        <template lwc:if={hasCurrentReservation}>
                            <div class="rail-res-card">
                                <div class="rail-res-guest-row">
                                    <div class="rail-res-avatar">{guestFirstName}</div>
                                    <div class="rail-res-guest-info">
                                        <div class="rail-res-guest">{guestFullName}</div>
                                        <div class="rail-res-confirm">{resConfirmNum}</div>
                                    </div>
                                </div>
                                <div class="rail-res-divider"></div>
                                <div class="rail-res-detail-row">
                                    <div class="rail-res-detail-item">
                                        <span class="rail-res-detail-label">Dates</span>
                                        <span class="rail-res-detail-value">{resDateRange}</span>
                                    </div>
                                    <div class="rail-res-detail-item">
                                        <span class="rail-res-detail-label">Nights</span>
                                        <span class="rail-res-detail-value">{resNights}</span>
                                    </div>
                                </div>
                                <div class="rail-res-badges">
                                    <span class={resBadgeClass}>{resStatus}</span>
                                </div>
                            </div>
                        </template>
                        <template lwc:else>
                            <div class="rail-empty">
                                <div class="rail-empty-icon">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg>
                                </div>
                                No current reservation
                            </div>
                        </template>
                    </div>

                    <!-- Revenue (This Month) -->
                    <div class="rail-section">
                        <div class="rail-title">
                            <svg class="rail-title-icon" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 4a2 2 0 00-2 2v4a2 2 0 002 2V6h10a2 2 0 00-2-2H4zm2 6a2 2 0 012-2h8a2 2 0 012 2v4a2 2 0 01-2 2H8a2 2 0 01-2-2v-4zm6 1a1 1 0 100 2 1 1 0 000-2z" clip-rule="evenodd"/></svg>
                            Revenue (This Month)
                        </div>
                        <div class="rail-stat-grid">
                            <div class="rail-stat-row">
                                <span class="rail-stat-label">Occupied Nights</span>
                                <span class="rail-stat-val">22</span>
                            </div>
                            <div class="rail-stat-row">
                                <span class="rail-stat-label">Revenue</span>
                                <span class="rail-stat-val rail-stat-val--green">$7,920</span>
                            </div>
                            <div class="rail-stat-row">
                                <span class="rail-stat-label">ADR</span>
                                <span class="rail-stat-val">{priceDisplay}</span>
                            </div>
                            <div class="rail-stat-row">
                                <span class="rail-stat-label">RevPAR</span>
                                <span class="rail-stat-val rail-stat-val--accent">$274</span>
                            </div>
                        </div>
                        <div class="rail-occ-section">
                            <div class="rail-occ-header">
                                <span class="rail-stat-label">Occupancy</span>
                                <span class="rail-occ-pct">76%</span>
                            </div>
                            <div class="prog-bar">
                                <div class="prog-fill prog-fill--blue" style="width:76%"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Upcoming Stays -->
                    <div class="rail-section">
                        <div class="rail-title">
                            <svg class="rail-title-icon" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd"/></svg>
                            Upcoming Stays
                        </div>
                        <div class="rail-empty">
                            <div class="rail-empty-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
                            </div>
                            No upcoming reservations
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <!-- Error state -->
        <template lwc:if={error}>
            <div class="error-state">
                <div class="error-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>
                </div>
                <p class="error-title">Unable to load room record</p>
                <p class="error-desc">Please check your permissions and try again.</p>
            </div>
        </template>
    </div>
</template>
