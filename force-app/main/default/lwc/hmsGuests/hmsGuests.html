<template>
    <div class="hms-page">
        <div class="page-header">
            <div class="header-left">
                <h1 class="page-title">Guests</h1>
                <span class="count-badge">{guestCount}</span>
            </div>
            <div class="header-right">
                <input type="text" class="hms-input search-input" placeholder="Search guests..." onkeyup={handleSearch} />
                <button class="hms-btn" onclick={handleExport}>Export</button>
                <button class="hms-btn hms-btn-primary" onclick={handleNewGuest}>+ New Guest</button>
            </div>
        </div>

        <template lwc:if={isLoading}>
            <div class="loading-wrap"><div class="hms-spinner"></div></div>
        </template>
        <template lwc:elseif={hasGuests}>
            <div class="hms-card table-wrap">
                <table class="hms-table">
                    <thead>
                        <tr>
                            <th>Guest</th>
                            <th>Guest Type</th>
                            <th>Nationality</th>
                            <th>Phone</th>
                            <th>Stays</th>
                            <th>Total Spent</th>
                            <th>Last Stay</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={guests} for:item="g">
                            <tr key={g.id} onclick={handleGuestClick} data-id={g.id}>
                                <td>
                                    <div class="guest-cell">
                                        <span class="avatar-sm">{g.initials}</span>
                                        <div>
                                            <div class="guest-name">{g.fullName}</div>
                                            <div class="guest-email">{g.email}</div>
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <template lwc:if={g.isVip}>
                                        <span class="vip-tag">VIP</span>
                                    </template>
                                    <template lwc:else>
                                        <span class="text-muted">Regular</span>
                                    </template>
                                </td>
                                <td class="text-muted">{g.nationality}</td>
                                <td class="text-muted">{g.phone}</td>
                                <td class="text-muted">{g.stays}</td>
                                <td class="text-green">{g.formattedSpent}</td>
                                <td class="text-muted">{g.lastStay}</td>
                                <td>
                                    <template lwc:if={g.isActive}>
                                        <span class="status-badge status-active">Active</span>
                                    </template>
                                    <template lwc:else>
                                        <span class="status-badge status-inactive">Inactive</span>
                                    </template>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </template>
        <template lwc:else>
            <div class="empty-state">No guests found</div>
        </template>
    </div>
</template>
