<template>
    <div class="hms-page">
        <div class="page-header">
            <div class="page-title">Reports &amp; Analytics</div>
            <button class="hms-btn hms-btn-primary" onclick={handleCreateReport}>+ Create Custom Report</button>
        </div>

        <template lwc:if={isLoading}>
            <div class="loading-wrap"><div class="hms-spinner"></div></div>
        </template>
        <template lwc:elseif={hasReports}>
            <div class="reports-grid">
                <template for:each={reports} for:item="report">
                    <c-hms-report-card key={report.id} report={report}></c-hms-report-card>
                </template>
            </div>
        </template>
        <template lwc:else>
            <div class="empty-state">
                <p>No reports configured yet.</p>
                <p class="text-muted">Create Salesforce Reports to populate this section.</p>
            </div>
        </template>
    </div>
</template>
