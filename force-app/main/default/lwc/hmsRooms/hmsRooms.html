<template>
    <div class="hms-page">
        <div class="rooms-toolbar">
            <div class="stat-badge">All <strong>{totalCount}</strong></div>
            <div class="stat-badge">Vacant <strong class="stat-blue">{vacantCount}</strong></div>
            <div class="stat-badge">Occupied <strong class="stat-green">{occupiedCount}</strong></div>
            <div class="stat-badge">Clean <strong class="stat-green">{cleanCount}</strong></div>
            <div class="stat-badge">Dirty <strong class="stat-gold">{dirtyCount}</strong></div>
            <div class="toolbar-right">
                <input type="text" class="search-input" placeholder="Search rooms..." onkeyup={handleSearch} />
                <div class="view-toggle">
                    <button class={gridBtnClass} onclick={handleGridView}>Grid</button>
                    <button class={listBtnClass} onclick={handleListView}>List</button>
                </div>
            </div>
        </div>

        <template lwc:if={isLoading}>
            <div class="loading-wrap"><div class="hms-spinner"></div></div>
        </template>
        <template lwc:elseif={hasRooms}>
            <div class="rooms-grid">
                <template for:each={rooms} for:item="room">
                    <c-hms-room-card key={room.id} room={room}></c-hms-room-card>
                </template>
            </div>
        </template>
        <template lwc:else>
            <div class="empty-state">No rooms match your filters</div>
        </template>
    </div>
</template>
