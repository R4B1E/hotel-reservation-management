<template>
    <div class="hms-card chart-card">
        <div class="hms-card-header">
            <span class="hms-card-title">{title}</span>
        </div>
        <div class="chart-container">
            <div class="bars-wrapper">
                <template for:each={bars} for:item="bar">
                    <div class="bar-col" key={bar.key}>
                        <div class="bar-value">{bar.displayValue}</div>
                        <div class="bar-track">
                            <div class="bar-fill" style={bar.style}></div>
                        </div>
                        <div class="bar-label">{bar.label}</div>
                    </div>
                </template>
            </div>
        </div>
    </div>
</template>
