<template>
    <header class={headerClass}>
        <div class="nav-inner">
            <!-- Logo -->
            <a href="#" class="nav-logo" data-page="home" onclick={handleNav}>
                <span class="logo-ring">&#x25EF;</span>
                <span class="logo-text">The Azure</span>
            </a>

            <!-- Nav Links -->
            <nav class="nav-links">
                <a href="#" class="nav-link" data-page="story" onclick={handleNav}>Story</a>
                <a href="#" class="nav-link" data-page="rooms" onclick={handleNav}>Rooms</a>
                <a href="#" class="nav-link" data-page="amenities" onclick={handleNav}>Amenities</a>
                <a href="#" class="nav-link" data-page="location" onclick={handleNav}>Location</a>
            </nav>

            <!-- CTA -->
            <div class="nav-actions">
                <a href="#" class="nav-login" data-page="login" onclick={handleNav}>Login</a>
                <a href="#" class="nav-book-btn" data-page="book" onclick={handleNav}>
                    <span>Book Stay</span>
                </a>
            </div>

            <!-- Hamburger -->
            <button class="nav-hamburger" onclick={toggleMenu} aria-label="Toggle menu">
                <span class={menuLine1}></span>
                <span class={menuLine2}></span>
                <span class={menuLine3}></span>
            </button>
        </div>

        <!-- Mobile Menu -->
        <div class={mobileMenuClass}>
            <nav class="mobile-nav-links">
                <a href="#" class="mobile-nav-link" data-page="story" onclick={handleNav}>Story</a>
                <a href="#" class="mobile-nav-link" data-page="rooms" onclick={handleNav}>Rooms</a>
                <a href="#" class="mobile-nav-link" data-page="amenities" onclick={handleNav}>Amenities</a>
                <a href="#" class="mobile-nav-link" data-page="location" onclick={handleNav}>Location</a>
                <a href="#" class="mobile-nav-link" data-page="login" onclick={handleNav}>Login</a>
                <a href="#" class="mobile-nav-cta" data-page="book" onclick={handleNav}>Book Stay</a>
            </nav>
        </div>
    </header>
</template>
