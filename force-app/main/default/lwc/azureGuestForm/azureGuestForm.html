<template>
    <div class="guest-form">
        <h3 class="form-heading">Guest Information</h3>

        <div class="form-row">
            <div class="form-field">
                <label class="field-lbl" for="firstName">First Name</label>
                <input class="field-input" id="firstName" type="text" value={firstName} onchange={handleChange} data-field="firstName" placeholder="Elena"/>
            </div>
            <div class="form-field">
                <label class="field-lbl" for="lastName">Last Name</label>
                <input class="field-input" id="lastName" type="text" value={lastName} onchange={handleChange} data-field="lastName" placeholder="Vassilou"/>
            </div>
        </div>

        <div class="form-row">
            <div class="form-field form-field--full">
                <label class="field-lbl" for="email">Email Address</label>
                <input class="field-input" id="email" type="email" value={email} onchange={handleChange} data-field="email" placeholder="elena@example.com"/>
            </div>
        </div>

        <div class="form-row">
            <div class="form-field">
                <label class="field-lbl" for="phone">Phone</label>
                <input class="field-input" id="phone" type="tel" value={phone} onchange={handleChange} data-field="phone" placeholder="+30 ..."/>
            </div>
            <div class="form-field">
                <label class="field-lbl" for="country">Country</label>
                <select class="field-input field-select" id="country" onchange={handleChange} data-field="country">
                    <option value="">Select country</option>
                    <option value="GR">Greece</option>
                    <option value="US">United States</option>
                    <option value="GB">United Kingdom</option>
                    <option value="FR">France</option>
                    <option value="DE">Germany</option>
                    <option value="other">Other</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-field form-field--full">
                <label class="field-lbl" for="requests">Special Requests</label>
                <textarea class="field-input field-textarea" id="requests" onchange={handleChange} data-field="requests" placeholder="Allergies, celebrations, preferences…" rows="3"></textarea>
            </div>
        </div>
    </div>
</template>
