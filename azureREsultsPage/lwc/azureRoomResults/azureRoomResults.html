<template>
    <div class="results-list">
        <template if:true={hasRooms}>
            <template for:each={enrichedRooms} for:item="room">
                <div key={room.id}
                     class={room.cardWrapClass}
                     data-id={room.id}
                     onclick={handleSelect}>

                    <!-- Image carousel -->
                    <div class="card-gallery">
                        <img class="card-img"
                             src={room.currentImage}
                             alt={room.name} />
                        <template if:true={room.featured}>
                            <span class="featured-badge">Featured</span>
                        </template>
                        <template if:false={room.available}>
                            <div class="unavailable-overlay">Sold Out</div>
                        </template>
                        <div class="gallery-dots">
                            <template for:each={room.imageDots} for:item="dot">
                                <span key={dot.idx} class={dot.cls}
                                      data-room={room.id} data-img={dot.idx}
                                      onclick={handleDotClick}></span>
                            </template>
                        </div>
                    </div>

                    <!-- Card body -->
                    <div class="card-body">
                        <div class="card-body-top">
                            <div>
                                <span class="room-category">{room.category}</span>
                                <h2 class="room-name">{room.name}</h2>
                                <p class="room-tagline">{room.tagline}</p>
                            </div>
                            <div class="room-rating">
                                <span class="rating-star">★</span>
                                <span class="rating-val">{room.rating}</span>
                                <span class="rating-count">({room.reviews})</span>
                            </div>
                        </div>

                        <div class="room-meta">
                            <span class="meta-chip">{room.sqm} m²</span>
                            <span class="meta-chip">{room.bed}</span>
                            <span class="meta-chip">{room.view} View</span>
                            <span class="meta-chip">Up to {room.maxGuests} guests</span>
                        </div>

                        <div class="room-amenities">
                            <template for:each={room.topAmenities} for:item="a">
                                <span key={a} class="amenity-pill">✓ {a}</span>
                            </template>
                        </div>

                        <div class="card-footer">
                            <div class="price-block">
                                <span class="price-from">from</span>
                                <span class="price-val">€{room.pricePerNight}</span>
                                <span class="price-unit">/ night</span>
                                <div class="price-total">€{room.totalPrice} total · {nights} nights</div>
                            </div>
                            <button class="select-btn" data-id={room.id} onclick={handleSelect}>
                                View &amp; Reserve
                            </button>
                        </div>
                    </div>
                </div>
            </template>
        </template>
        <template if:false={hasRooms}>
            <div class="empty-state">
                <span class="empty-icon">⊘</span>
                <h3 class="empty-title">No rooms match your filters</h3>
                <p class="empty-sub">Try adjusting your price range or room type.</p>
            </div>
        </template>
    </div>
</template>
