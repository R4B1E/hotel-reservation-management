<template>
    <aside class="filters">
        <h2 class="filters-title">Refine</h2>

        <!-- Sort -->
        <div class="filter-group">
            <h3 class="group-label">Sort By</h3>
            <div class="sort-options">
                <template for:each={sortOptions} for:item="opt">
                    <button key={opt.value}
                            class={opt.btnClass}
                            data-value={opt.value}
                            onclick={handleSort}>
                        {opt.label}
                    </button>
                </template>
            </div>
        </div>

        <!-- Room type -->
        <div class="filter-group">
            <h3 class="group-label">Room Type</h3>
            <div class="type-options">
                <template for:each={typeOptions} for:item="opt">
                    <button key={opt.value}
                            class={opt.btnClass}
                            data-value={opt.value}
                            onclick={handleType}>
                        {opt.label}
                    </button>
                </template>
            </div>
        </div>

        <!-- View -->
        <div class="filter-group">
            <h3 class="group-label">View</h3>
            <div class="type-options">
                <template for:each={viewOptions} for:item="opt">
                    <button key={opt.value}
                            class={opt.btnClass}
                            data-value={opt.value}
                            onclick={handleView}>
                        {opt.label}
                    </button>
                </template>
            </div>
        </div>

        <!-- Max price -->
        <div class="filter-group">
            <h3 class="group-label">Max Price / Night</h3>
            <div class="price-display">
                <span class="price-val">€{filters.maxPrice}</span>
            </div>
            <input type="range"
                   class="price-slider"
                   min="200" max="1500" step="50"
                   value={filters.maxPrice}
                   oninput={handlePrice} />
            <div class="price-range-labels">
                <span>€200</span><span>€1,500</span>
            </div>
        </div>

        <button class="reset-btn" onclick={resetFilters}>Reset Filters</button>
    </aside>
</template>
