<template>
    <nav class="results-nav">
        <div class="nav-left">
            <a class="nav-logo" href="#">
                <span class="logo-ring"></span>The Azure
            </a>
        </div>
        <div class="nav-search">
            <button class="search-pill" onclick={toggleEdit}>
                <span class="pill-section">{checkIn}</span>
                <span class="pill-divider">→</span>
                <span class="pill-section">{checkOut}</span>
                <span class="pill-divider">·</span>
                <span class="pill-section">{guests}</span>
                <span class="pill-edit-icon">✎</span>
            </button>
            <template if:true={editOpen}>
                <div class="edit-panel">
                    <div class="edit-field">
                        <label class="edit-label">Check-In</label>
                        <input type="date" class="edit-input" value={localCheckIn} onchange={handleCI} />
                    </div>
                    <div class="edit-field">
                        <label class="edit-label">Check-Out</label>
                        <input type="date" class="edit-input" value={localCheckOut} onchange={handleCO} />
                    </div>
                    <div class="edit-field">
                        <label class="edit-label">Guests</label>
                        <select class="edit-input" onchange={handleGuests}>
                            <template for:each={guestOptions} for:item="o">
                                <option key={o.value} value={o.value}>{o.label}</option>
                            </template>
                        </select>
                    </div>
                    <button class="edit-apply" onclick={applySearch}>Update Search</button>
                </div>
            </template>
        </div>
        <div class="nav-right">
            <a href="#" class="nav-link">My Reservations</a>
            <a href="#" class="btn-primary">Sign In</a>
        </div>
    </nav>
</template>
