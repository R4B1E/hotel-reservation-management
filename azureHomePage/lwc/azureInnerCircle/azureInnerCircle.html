<template>
    <section class="inner-circle">
        <div class="ic-inner" data-reveal>
            <span class="ic-icon" aria-hidden="true">✦</span>
            <h2 class="ic-title">{title}</h2>
            <p class="ic-sub">{subtitle}</p>
            <div class="ic-form">
                <input type="email"
                       class="ic-input"
                       placeholder="Email address"
                       value={email}
                       onchange={handleEmail}
                       onkeydown={handleKeydown} />
                <button class="ic-btn" onclick={handleSubscribe} disabled={subscribed}>
                    {btnLabel}
                </button>
            </div>
            <template if:true={message}>
                <p class="ic-message">{message}</p>
            </template>
        </div>
    </section>
</template>
