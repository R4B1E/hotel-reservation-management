<template>
    <nav class={navClass}>
        <div class="nav-inner">
            <a class="nav-logo" href="#">
                <span class="logo-ring"></span>
                The Azure
            </a>
            <ul class="nav-links">
                <template for:each={navLinks} for:item="link">
                    <li key={link.label}>
                        <a href={link.href}>{link.label}</a>
                    </li>
                </template>
            </ul>
            <div class="nav-actions">
                <a href="#" class="btn-ghost">Login</a>
                <a href="#" class="btn-primary">Book Stay</a>
            </div>
            <!-- Mobile hamburger -->
            <button class="hamburger" onclick={toggleMenu} aria-label="Toggle menu">
                <span></span><span></span><span></span>
            </button>
        </div>
        <!-- Mobile menu -->
        <template if:true={menuOpen}>
            <div class="mobile-menu">
                <template for:each={navLinks} for:item="link">
                    <a key={link.label} href={link.href} onclick={toggleMenu}>{link.label}</a>
                </template>
                <a href="#" class="btn-primary" style="display:inline-block;margin-top:16px;">Book Stay</a>
            </div>
        </template>
    </nav>
</template>
