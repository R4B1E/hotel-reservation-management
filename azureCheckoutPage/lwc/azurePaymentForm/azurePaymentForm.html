<template>
    <div class="payment-form">
        <header class="form-header">
            <span class="form-eyebrow">Step 02</span>
            <h1 class="form-title">Secure Payment</h1>
            <p class="form-sub">Your payment is encrypted end-to-end. We accept all major cards.</p>
        </header>

        <!-- Payment method tabs -->
        <div class="payment-methods">
            <button class={cardTabCls} data-method="card" onclick={selectMethod}>
                <span class="method-icon">💳</span> Credit / Debit Card
            </button>
            <button class={transferTabCls} data-method="transfer" onclick={selectMethod}>
                <span class="method-icon">🏦</span> Bank Transfer
            </button>
        </div>

        <!-- Card form -->
        <template if:true={isCard}>
            <div class="card-form-fields">
                <!-- Card previsualization -->
                <div class="card-preview" style={cardStyle}>
                    <div class="card-chip"></div>
                    <div class="card-number-preview">{maskedCardNumber}</div>
                    <div class="card-bottom-row">
                        <div>
                            <div class="card-meta-label">Card Holder</div>
                            <div class="card-meta-val">{cardHolderDisplay}</div>
                        </div>
                        <div>
                            <div class="card-meta-label">Expires</div>
                            <div class="card-meta-val" lwc:if={cardData.expiry}>{cardData.expiry}</div>
                            <div class="card-meta-val" lwc:else>MM/YY</div>
                        </div>
                        <div class="card-network">{cardNetworkLabel}</div>
                    </div>
                </div>

                <div class="field-wrap">
                    <label class="field-label">Card Number <span class="req">*</span></label>
                    <input class="field-input" type="text" maxlength="19"
                           placeholder="0000 0000 0000 0000"
                           value={cardData.number}
                           oninput={handleCardNumber}
                           data-field="number" />
                    <template if:true={errors.number}>
                        <span class="field-error">{errors.number}</span>
                    </template>
                </div>

                <div class="field-wrap">
                    <label class="field-label">Card Holder Name <span class="req">*</span></label>
                    <input class="field-input" type="text"
                           placeholder="As it appears on the card"
                           value={cardData.holder}
                           oninput={handleInput}
                           data-field="holder" />
                    <template if:true={errors.holder}>
                        <span class="field-error">{errors.holder}</span>
                    </template>
                </div>

                <div class="field-grid two-col">
                    <div class="field-wrap">
                        <label class="field-label">Expiry Date <span class="req">*</span></label>
                        <input class="field-input" type="text" maxlength="5"
                               placeholder="MM/YY"
                               value={cardData.expiry}
                               oninput={handleExpiry}
                               data-field="expiry" />
                        <template if:true={errors.expiry}>
                            <span class="field-error">{errors.expiry}</span>
                        </template>
                    </div>
                    <div class="field-wrap">
                        <label class="field-label">CVV / CVC <span class="req">*</span></label>
                        <input class="field-input" type="password" maxlength="4"
                               placeholder="•••"
                               value={cardData.cvv}
                               oninput={handleInput}
                               data-field="cvv" />
                        <template if:true={errors.cvv}>
                            <span class="field-error">{errors.cvv}</span>
                        </template>
                        <span class="field-hint">3 digits on the back of your card</span>
                    </div>
                </div>

                <label class="checkbox-label">
                    <input type="checkbox" class="checkbox-input"
                           checked={saveCard}
                           onchange={handleSaveCard} />
                    <span class="checkbox-custom"></span>
                    <span class="checkbox-text">Save card securely for future stays</span>
                </label>
            </div>
        </template>

        <!-- Bank transfer info -->
        <template if:false={isCard}>
            <div class="transfer-info">
                <p class="transfer-text">After confirming your reservation, we will email you our bank details within 2 hours. Your room is held for 24 hours pending transfer receipt.</p>
                <div class="transfer-detail">
                    <span class="td-label">Account Name</span>
                    <span class="td-val">The Azure Sanctuary SA</span>
                </div>
                <div class="transfer-detail">
                    <span class="td-label">IBAN</span>
                    <span class="td-val">GR12 0110 0250 0000 0012 3456 789</span>
                </div>
                <div class="transfer-detail">
                    <span class="td-label">SWIFT / BIC</span>
                    <span class="td-val">ETHNGRAA</span>
                </div>
            </div>
        </template>

        <!-- Billing address accordion -->
        <div class="billing-toggle" onclick={toggleBilling}>
            <span>Billing address {billingLabel}</span>
            <span class="toggle-icon">{billingIcon}</span>
        </div>
        <template if:true={showBilling}>
            <div class="billing-fields">
                <div class="field-grid two-col">
                    <div class="field-wrap">
                        <label class="field-label">Address Line 1</label>
                        <input class="field-input" type="text" placeholder="Street address" />
                    </div>
                    <div class="field-wrap">
                        <label class="field-label">City</label>
                        <input class="field-input" type="text" placeholder="City" />
                    </div>
                </div>
                <div class="field-grid two-col">
                    <div class="field-wrap">
                        <label class="field-label">Postal Code</label>
                        <input class="field-input" type="text" placeholder="00000" />
                    </div>
                    <div class="field-wrap">
                        <label class="field-label">Country</label>
                        <input class="field-input" type="text" placeholder="Country" />
                    </div>
                </div>
            </div>
        </template>

        <template if:true={showErrorSummary}>
            <div class="error-summary">
                <span class="error-summary-icon">!</span>
                Please fill in all required payment fields.
            </div>
        </template>

        <!-- Actions -->
        <div class="form-actions">
            <button class="back-btn" onclick={handleBack}>← Back</button>
            <button class="submit-btn" onclick={handleSubmit} disabled={submitting}>
                <template if:false={submitting}>
                    <span>🔒</span>
                    Confirm &amp; Pay
                </template>
                <template if:true={submitting}>
                    <span class="spinner"></span>
                    Processing…
                </template>
            </button>
        </div>

        <p class="legal-note">
            By confirming, you agree to The Azure's <a href="#">terms &amp; conditions</a> and <a href="#">cancellation policy</a>. Your card will be charged immediately upon confirmation.
        </p>
    </div>
</template>
